name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK de prueba · AlertaVecinal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Preparar Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Preparar JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Preparar SDK Android 35
        run: python3 scripts/prepare-android-sdk.py

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          npm ci
          npm test

      - name: Compilar React y sincronizar Android
        run: npm run android:sync

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --max-workers=2

      - name: Verificar y preparar el archivo
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/AlertaVecinal-debug.apk
          cd artifacts
          sha256sum AlertaVecinal-debug.apk > AlertaVecinal-debug.apk.sha256

      - name: Descargar APK como artefacto
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AlertaVecinal-Android-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Mostrar instrucciones
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          ### APK de AlertaVecinal generado
          Descarga **AlertaVecinal-Android** desde la sección **Artifacts** de esta ejecución y descomprime el ZIP.
          El archivo **AlertaVecinal-debug.apk** es una app de prueba; no requiere abrir Android Studio para instalarlo.
          La app necesita el servidor Node.js/SQLite encendido. En el emulador usa `http://10.0.2.2:3001`; en un celular configura la IP de tu computadora desde **Servidor Android**.
          Esta compilación no ejecuta un emulador ni publica la app en Google Play. Consulta **ANDROID.md** en el repositorio para probar cámara, GPS y conexión.
          EOF_SUMMARY
